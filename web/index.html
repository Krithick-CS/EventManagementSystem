<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campus Event Management</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Campus Event Management</h1>
    <nav>
      <span class="active" data-tab="venues">Venues</span>
      <span data-tab="events">Events</span>
      <span class="soon">Participants</span>
    </nav>
  </header>

  <main>
    <!-- ===== Venues tab ===== -->
    <div class="tab" id="tab-venues">
      <section class="card">
        <h2>Venues</h2>
        <table>
          <thead>
            <tr><th>ID</th><th>Name</th><th>Capacity</th><th>Location</th></tr>
          </thead>
          <tbody id="venue-rows"></tbody>
        </table>
      </section>

      <section class="card">
        <h2>Add venue</h2>
        <form id="venue-form">
          <label>Name <input name="name" required></label>
          <label>Capacity <input name="capacity" type="number" min="1" required></label>
          <label>Location <input name="location"></label>
          <button type="submit">Add venue</button>
        </form>
        <p id="message" role="status"></p>
      </section>
    </div>

    <!-- ===== Events tab ===== -->
    <div class="tab" id="tab-events" hidden>
      <section class="card">
        <h2>Events</h2>
        <div class="scroll">
          <table>
            <thead>
              <tr>
                <th>ID</th><th>Title</th><th>Venue</th><th>Start</th><th>End</th>
                <th>Registered</th><th>Status</th><th>Actions</th>
              </tr>
            </thead>
            <tbody id="event-rows"></tbody>
          </table>
        </div>
        <p id="event-action-message" role="status"></p>
      </section>

      <section class="card">
        <h2>Create event</h2>
        <form id="event-form">
          <label>Title <input name="title" required></label>
          <label>Organizer <input name="organizer" required></label>
          <label>Description <input name="description"></label>
          <label>Venue <select name="venueId" id="event-venue" required></select></label>
          <label>Start <input name="start" type="datetime-local" required></label>
          <label>End <input name="end" type="datetime-local" required></label>
          <label>Max capacity <input name="capacity" type="number" min="1" required></label>
          <button type="submit">Create event</button>
        </form>
        <p id="event-message" role="status"></p>
      </section>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
